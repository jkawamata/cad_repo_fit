};
const readBeforeResaveTracking=read;
read=async file=>{

  loaded3mfStem=loaded3mfForResave?file.name.replace(/\.3mf$/i,''):'';

<script>
/* WebGLキャンバスを印刷可能なPNGへ置き換えてから、A4印刷を開始する。 */
const nativeCadPrint=window.print.bind(window);
let printSnapshots=[];
function makePrintSnapshot(canvas,index){
  const rect=canvas.getBoundingClientRect();
  const width=Math.max(80,Math.round(rect.width*2));
  const height=Math.max(80,Math.round(rect.height*2));
  const source=document.createElement('canvas');
  const renderer=new THREE.WebGLRenderer({canvas:source,antialias:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(1);renderer.setSize(width,height,false);renderer.setClearColor(0xffffff,1);
  let camera;
  if(index===1){
    camera=new THREE.PerspectiveCamera(35,width/height,.1,100);camera.up.set(0,0,1);
    const distance=9/(zooms[1]||1);
    camera.position.copy(isoTarget).add(new THREE.Vector3(Math.cos(isoAzimuth)*Math.cos(isoElevation)*distance,Math.sin(isoAzimuth)*Math.cos(isoElevation)*distance,Math.sin(isoElevation)*distance));
    camera.lookAt(isoTarget);
  }else{
    const scale=3.1/(zooms[0]||1),ratio=width/height;
    camera=new THREE.OrthographicCamera(-scale*ratio,scale*ratio,scale,-scale,.1,100);camera.up.set(0,0,1);
    if(index===0)camera.position.set(0,0,8);
    if(index===2)camera.position.set(0,-8,0);
    if(index===3)camera.position.set(8,0,0);
    camera.lookAt(0,0,0);
  }
  renderer.render(sc,camera);
  const url=source.toDataURL('image/png');
  renderer.dispose();
  return url;
}
function restorePrintSnapshots(){

}
addEventListener('afterprint',restorePrintSnapshots);

};

<script>

<script>
/* 文章を持たないデータを開く前に、現在の記入内容が消えることを確認する。 */
async function incomingFileHasReportText(file){
  if(!file||!/\.3mf$/i.test(file.name))return false;
  try{
    const zip=await JSZip.loadAsync(file),metadata=zip.file('Metadata/CAD課題FIT.json');
    if(!metadata)return false;
    const data=JSON.parse(await metadata.async('text'));
    return Boolean(String(data.reference||'').trim()||String(data.reflection||'').trim());
  }catch(error){return false}
}
const readBeforeReportTextLossCheck=read;
read=async file=>{
  const hasCurrentText=Boolean(String(info.reference||'').trim()||String(info.reflection||'').trim());
  const incomingHasText=await incomingFileHasReportText(file);
  let approvedTextLoss=false;
  if(file&&hasCurrentText&&!incomingHasText){
    const approved=window.confirm('読み込むファイルには「参考にしたもの」「気づいたこと・考えたこと」の入力内容がありません。\n\n現在入力している内容は消えます。読み込みを続けますか？');
    if(!approved)return;
    approvedTextLoss=true;
  }
  if(approvedTextLoss&&/\.stl$/i.test(file.name))window.__cadReportSkipLegacyStlConfirm=true;
  try{return await readBeforeReportTextLossCheck(file)}finally{window.__cadReportSkipLegacyStlConfirm=false}
};
const versionFor107=document.querySelector('.title h1 .version');
if(versionFor107)versionFor107.textContent='v1.07';
</script>
